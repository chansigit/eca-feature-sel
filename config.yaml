# eca-feature-sel configuration
# Paths are cluster-specific; edit for your environment. cache_root MUST be on
# $SCRATCH (never $HOME) per Sherlock policy.

inputs_tsv:                                                  # sample_key/species/h5ad lists
  - mouse.tsv
  - human.tsv
cache_root:  /scratch/users/chensj16/eca-feature-sel/cache   # all computed results (reused)
venv_python: /scratch/users/chensj16/venvs/dl2025/.venv/bin/python
ensembl_release: "116"                                       # for the biotype reference

slurm:
  partition: normal
  time: "02:00:00"
  mem: 32GB
  cpus: 4
  array_throttle: 40         # max concurrent array tasks (be nice to the scheduler)

# Measured per dataset (changing this invalidates the cache).
# A dataset's HVG set = the dataset-level call UNION the per-lineage calls.
# var.highly_variable as the upstream rsi pipeline left it is recorded alongside.
hvg:
  layer: counts
  compute: true            # false = only read upstream var.highly_variable
  method: vst              # vst (seurat_v3 loess) | pearson (analytic Pearson residuals, ~50x slower)
  n_store: 5000            # per lineage, keep the top-n_store genes' score/rank (= max n_max)
  span: 0.3                # vst: loess span; quadratic fit is the fallback
  theta: 100               # pearson: NB overdispersion (Lause 2021 default)
  # numerical guards, not QC (rsi already did QC): keep these loose
  min_cell_counts: 10      # drop cells with fewer total counts (mu ~ 0 breaks pearson)
  min_gene_cells: 3        # a gene seen in fewer cells of a group is not ranked there
  min_lineage_cells: 200   # measurement floor; raise it again at build time
  lineage_obs_key:         # first one present in obs wins
    - zmip_ann_coarse
    - msp_ann_coarse
    - cell_lineage

# Applied at build time; all overridable on the `build` CLI. Nothing here changes
# the measurement, so retuning is instant: edit and re-run `build --tag ...`.
selection:
  # Which per-dataset HVG call lets a dataset vote for a gene:
  #   union    dataset-level call OR its lineage calls   (the intended default)
  #   global   dataset-level call only
  #   lineage  lineage calls only
  #   upstream var.highly_variable as the rsi pipeline left it (seurat, 2000, batched)
  hvg_source: union
  # A gene passes in a group when score >= s_min (standardized variance: 1 = as
  # variable as a typical gene of that expression level) and rank <= n_max (cap).
  s_min: 1.3
  n_max: 3000
  min_lineage_cells: 200     # ignore smaller lineages (>= hvg.min_lineage_cells)
  min_lineages: 1            # gene must pass in this many lineages to vote that way

  # HVG support a gene needs, per category. Keys are is_* flags or exact Ensembl
  # biotypes; FIRST match wins (so put narrow categories first), `default` is the
  # fallback. See cache/vocab/<tag>/thresholds_{sp}.tsv for the tuning table.
  hvg_min_datasets:
    protein_coding: 3
    default: 10              # lncRNA and everything else

  # Whitelist / blacklist, applied last; keys are is_* flags or exact biotypes;
  # keep wins over drop. For a foundation-model vocabulary:
  #   keep  immune constant genes (isotype / TCR lineage markers) and sex genes
  #   drop  pseudogenes (multi-mapping), V/D/J segments (clonotype, not cell
  #         state), small RNAs (poly-A capture artefacts), TEC (unconfirmed loci)
  category_keep: [is_IG_C, is_TR_C, is_sex]
  category_drop: [is_pseudogene, is_IG_V, is_IG_D, is_IG_J, is_TR_V, is_TR_D, is_TR_J,
                  TEC, miRNA, snoRNA, snRNA, scaRNA, misc_RNA, rRNA, Mt_tRNA, Mt_rRNA, ribozyme, vault_RNA]
